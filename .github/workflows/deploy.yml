name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  security-gate-and-build:
    name: Security Verification Gate & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Full History for Git Scanner)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Deterministic Lockfile)
        run: npm ci

      - name: Compile Production Bundle
        run: npm run build

      - name: Run CI/CD Security Deployment Gate
        run: npm run security:gate

      - name: Upload Sanitized CI Security Gate Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-ci-artifacts
          path: |
            security-ci-gate-results.json
            security-supply-chain-results.json
            security-git-history-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: security-gate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
